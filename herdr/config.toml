onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+a"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 10485760

[experimental]
pane_history = true
allow_nested = false

[session]
resume_agents_on_restore = true
