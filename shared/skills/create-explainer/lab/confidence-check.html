<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Confidence Check</title>
<style>
  :root{--bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;--accent:#58a6ff;--client:#3fb950;--danger:#f85149;--warn:#d29922;--font-mono:"SF Mono",ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}.container{max-width:760px;margin:0 auto}h1{margin:0 0 8px;color:var(--text-bright);font-size:24px}p{color:var(--text-dim);margin:0 0 20px}.panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0}.answers{display:grid;gap:10px;margin:16px 0}.answer{padding:12px 14px;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);cursor:pointer}.answer:hover{border-color:var(--accent);background:var(--bg-card)}.answer.correct{border-color:var(--client);background:rgba(63,185,80,.10);color:var(--client)}.answer.wrong{border-color:var(--danger);background:rgba(248,81,73,.10);color:var(--danger)}.confidence{display:none;margin-top:16px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.conf-btn{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}.conf-btn:hover,.conf-btn.selected{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.08)}.feedback{display:none;margin-top:14px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text-dim)}.feedback strong{display:block;color:var(--text-bright);margin-bottom:4px}.meter{height:10px;background:var(--bg);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-bright);font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:700px){body{padding:16px}.scale{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>Confidence Check</h1>
  <p>Capture confidence after an answer so the explainer can spot shaky knowledge and false confidence.</p>
  <div class="panel">
    <strong id="question" style="color:var(--text-bright)"></strong>
    <div class="answers" id="answers"></div>
    <div class="confidence" id="confidence">
      <strong style="color:var(--text-bright)">How confident were you?</strong>
      <div class="scale" id="scale"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn" onclick="next()">Next</button>
  </div>
</div>
<script>
/* ================================================================
   ADAPT THIS SECTION: Replace questions. Store results locally if useful.
   Use confidence to decide whether to re-teach or re-ask later.
=============================================================== */
const questions=[
  {q:"Who owns truth for authorization?", options:["Client", "Server", "CSS"], correct:1, explain:"Authorization must be server-owned because clients can be modified."},
  {q:"What should happen before a state-changing write?", options:["Broadcast", "Validate and authorize", "Render UI"], correct:1, explain:"Validate and authorize before state changes so bad requests fail without side effects."}
];
let idx=0, lastCorrect=false;
function render(){const q=questions[idx];document.getElementById('question').textContent=q.q;const a=document.getElementById('answers');a.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);a.appendChild(b);});document.getElementById('confidence').style.display='none';document.getElementById('feedback').style.display='none';}
function choose(choice){const q=questions[idx];lastCorrect=choice===q.correct;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});const scale=document.getElementById('scale');scale.innerHTML='';[1,2,3,4,5].forEach(n=>{const b=document.createElement('button');b.className='conf-btn';b.textContent=n;b.title=n===1?'Guessing':n===5?'Certain':'';b.onclick=()=>rate(n);scale.appendChild(b);});document.getElementById('confidence').style.display='block';}
function rate(n){document.querySelectorAll('.conf-btn').forEach((b,i)=>b.classList.toggle('selected',i+1===n));const q=questions[idx];let diagnosis=lastCorrect?(n>=4?'solid':'right but not confident'):(n>=4?'false confidence':'missed and knew it');const f=document.getElementById('feedback');f.innerHTML=`<strong>${diagnosis}</strong>${q.explain}<div class="meter"><span style="width:${n*20}%"></span></div>`;f.style.display='block';try{localStorage.setItem('confidence-check:last',JSON.stringify({question:q.q,correct:lastCorrect,confidence:n,diagnosis}));}catch(e){}}
function next(){idx=(idx+1)%questions.length;render();}
render();
</script>
</body>
</html>
