<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Self-Explanation Card</title>
<style>
  :root{--bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;--accent:#58a6ff;--client:#3fb950;--danger:#f85149;--warn:#d29922;--font-mono:"SF Mono",ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}.container{max-width:820px;margin:0 auto}h1{margin:0 0 8px;color:var(--text-bright);font-size:24px}p{color:var(--text-dim);margin:0 0 20px}.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0}pre{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:13px;line-height:1.5}.line{display:block;padding:2px 4px;border-radius:4px}.line.focus{background:rgba(88,166,255,.14);outline:1px solid rgba(88,166,255,.4)}.prompt{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin:14px 0;color:var(--text-bright)}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:14px}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-bright);font-weight:700;cursor:pointer;margin-right:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.feedback{display:none;margin-top:14px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text-dim)}.feedback strong{display:block;color:var(--text-bright);margin-bottom:4px}.checklist{margin-top:10px;color:var(--text-dim)}@media(max-width:700px){body{padding:16px}}
</style>
</head>
<body>
<div class="container">
  <h1>Self-Explanation Card</h1>
  <p>Ask the learner to explain why a line exists before showing the expert explanation.</p>
  <div class="card">
    <pre id="code"></pre>
    <div class="prompt" id="prompt"></div>
    <textarea id="answer" placeholder="Explain it in your own words..."></textarea>
    <div style="margin-top:14px"><button class="btn primary" onclick="showModel()">Compare With Model Answer</button><button class="btn" onclick="nextPrompt()">Next Prompt</button></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<script>
/* ================================================================
   ADAPT THIS SECTION: Replace prompts with lines from the real code.
   Each prompt should target why the line exists, not what it literally says.
=============================================================== */
const prompts = [
  {
    code: [`function handler(req) {`, `  requireAuth(req.user);`, `  validateBody(req.body);`, `  return createRecord(req.body);`, `}`],
    focus: 1,
    prompt: "Why does authentication happen before body validation here?",
    model: "Authentication is usually cheaper and more security-critical. If the caller is not allowed in, the server should fail before spending work on request details.",
    checklist: ["Mentions fail-fast behavior", "Mentions security or authority", "Does not claim the client is trusted"]
  },
  {
    code: [`const result = await save(input);`, `broadcast({ type: "updated", id: result.id });`, `return result;`],
    focus: 1,
    prompt: "Why broadcast after saving, not before?",
    model: "The broadcast should describe committed state. Broadcasting first can tell other clients about a change that later fails to persist.",
    checklist: ["Mentions committed state", "Mentions failure case", "Connects ordering to correctness"]
  }
];
let idx=0;
function render(){const p=prompts[idx];document.getElementById('code').innerHTML=p.code.map((line,i)=>`<span class="line ${i===p.focus?'focus':''}">${escapeHtml(line)}</span>`).join('\n');document.getElementById('prompt').textContent=p.prompt;document.getElementById('answer').value='';document.getElementById('feedback').style.display='none';}
function showModel(){const p=prompts[idx];const f=document.getElementById('feedback');f.innerHTML=`<strong>Model explanation</strong>${p.model}<div class="checklist"><strong>Good answer checks:</strong><ul>${p.checklist.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;f.style.display='block';}
function nextPrompt(){idx=(idx+1)%prompts.length;render();}
function escapeHtml(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}
render();
</script>
</body>
</html>
