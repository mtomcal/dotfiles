<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Worked Example Fader</title>
<style>
  :root{--bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;--accent:#58a6ff;--client:#3fb950;--danger:#f85149;--warn:#d29922;--font-mono:"SF Mono",ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}.container{max-width:900px;margin:0 auto}h1{margin:0 0 8px;color:var(--text-bright);font-size:24px}p{color:var(--text-dim);margin:0 0 20px}.panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.step{padding:8px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);font-size:12px;font-weight:700}.step.active{background:rgba(88,166,255,.12);border-color:var(--accent);color:var(--accent)}pre{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:13px;line-height:1.5}.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--warn);color:var(--warn);font-weight:700}.prompt{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin:12px 0;color:var(--text-dim)}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-family:var(--font-mono);font-size:13px}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-bright);font-weight:700;cursor:pointer;margin-right:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.feedback{display:none;margin-top:14px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text-dim)}.feedback strong{display:block;color:var(--text-bright);margin-bottom:4px}@media(max-width:700px){body{padding:16px}}
</style>
</head>
<body>
<div class="container">
  <h1>Worked Example Fader</h1>
  <p>Start with a complete example, then remove support until the learner can perform the task independently.</p>
  <div class="panel">
    <div class="steps" id="steps"></div>
    <h3 id="title" style="margin:0 0 8px;color:var(--text-bright)"></h3>
    <div class="prompt" id="prompt"></div>
    <pre id="code"></pre>
    <textarea id="answer" style="display:none" placeholder="Write your attempt here..."></textarea>
    <div style="margin-top:14px"><button class="btn" onclick="prevStage()">Back</button><button class="btn primary" onclick="nextStage()">Next</button><button class="btn" onclick="showAnswer()">Show Answer</button></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<script>
/* ================================================================
   ADAPT THIS SECTION: Replace stages with a real worked example.
   The idea is full solution -> partial solution -> prompt -> independent attempt.
=============================================================== */
const stages = [
  {title:"1. Full worked example", prompt:"Read the complete version. Notice each guard before the state change.", code:`function updateEmail(user, input) {\n  if (!user.authenticated) throw new Error("login required");\n  if (!input.email.includes("@")) throw new Error("invalid email");\n  return db.users.update(user.id, { email: input.email });\n}`},
  {title:"2. Partial support", prompt:"Two lines are hidden. Fill them mentally before moving on.", code:`function updateEmail(user, input) {\n  <span class="blank">auth guard?</span>\n  <span class="blank">validation?</span>\n  return db.users.update(user.id, { email: input.email });\n}`},
  {title:"3. Explain the why", prompt:"Why do the guards happen before the database write?", code:`// Write your explanation below.`, answer:true},
  {title:"4. Independent attempt", prompt:"Now write the same pattern for updating a display name.", code:`function updateDisplayName(user, input) {\n  // your code\n}`, answer:true}
];
let idx=0;
function render(){const s=stages[idx];document.getElementById('steps').innerHTML=stages.map((_,i)=>`<span class="step ${i===idx?'active':''}">Stage ${i+1}</span>`).join('');document.getElementById('title').textContent=s.title;document.getElementById('prompt').textContent=s.prompt;document.getElementById('code').innerHTML=s.code;document.getElementById('answer').style.display=s.answer?'block':'none';document.getElementById('feedback').style.display='none';}
function nextStage(){idx=Math.min(stages.length-1,idx+1);render();}
function prevStage(){idx=Math.max(0,idx-1);render();}
function showAnswer(){const f=document.getElementById('feedback');f.innerHTML='<strong>Model answer</strong>Authenticate first, validate input second, then perform the state change. The database write should only happen after the request has proven who is acting and that the input is safe.';f.style.display='block';}
render();
</script>
</body>
</html>
