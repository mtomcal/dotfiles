<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Prediction Lab</title>
<style>
  :root{--bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;--accent:#58a6ff;--client:#3fb950;--danger:#f85149;--warn:#d29922;--font-mono:"SF Mono",ui-monospace,monospace}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}.container{max-width:900px;margin:0 auto}h1{margin:0 0 8px;color:var(--text-bright);font-size:24px}p{color:var(--text-dim);margin:0 0 20px}.panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0}pre{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:13px;line-height:1.5}.choices{display:grid;gap:10px;margin:16px 0}.choice{padding:12px 14px;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);cursor:pointer}.choice:hover{border-color:var(--accent);background:var(--bg-card)}.choice.correct{border-color:var(--client);background:rgba(63,185,80,.1);color:var(--client)}.choice.wrong{border-color:var(--danger);background:rgba(248,81,73,.1);color:var(--danger)}.timeline{display:grid;gap:8px;margin-top:16px}.event{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;opacity:.35;transform:translateY(4px);transition:all .25s}.event.visible{opacity:1;transform:translateY(0);border-color:var(--accent)}.event .dot{width:10px;height:10px;border-radius:999px;background:var(--accent);margin-top:7px;flex:0 0 auto}.feedback{display:none;margin-top:14px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text-dim)}.feedback strong{display:block;color:var(--text-bright);margin-bottom:4px}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-bright);font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}@media(max-width:700px){body{padding:16px}}
</style>
</head>
<body>
<div class="container">
  <h1>Prediction Lab</h1>
  <p>Make the learner commit to an answer before revealing the behavior. Use this for state, async, caching, and event flow.</p>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <strong id="round" style="color:var(--accent)"></strong>
      <button class="btn" onclick="nextScenario()">Next Scenario</button>
    </div>
    <h3 id="question" style="color:var(--text-bright);margin:12px 0"></h3>
    <pre id="snippet"></pre>
    <div class="choices" id="choices"></div>
    <button class="btn primary" id="reveal" onclick="reveal()" style="display:none">Reveal Timeline</button>
    <div class="feedback" id="feedback"></div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>
<script>
/* ================================================================
   ADAPT THIS SECTION: Replace scenarios with code/system states.
   Keep each prediction narrow: output, next state, next event, or owner of truth.
=============================================================== */
const scenarios = [
  {
    question: "What logs first?",
    snippet: `console.log("A");\nPromise.resolve().then(() => console.log("B"));\nconsole.log("C");`,
    options: ["A, B, C", "A, C, B", "B, A, C"],
    correct: 1,
    explain: "The synchronous logs run first. The promise callback runs in the microtask queue after the current stack clears.",
    events: ["console.log('A') runs synchronously", "Promise callback is queued", "console.log('C') runs synchronously", "Microtask queue runs console.log('B')"]
  },
  {
    question: "Which gate blocks this request?",
    snippet: `user = { authenticated: true, role: "viewer" }\nrequest = { action: "delete-project" }`,
    options: ["Authentication", "Authorization", "Rate limit"],
    correct: 1,
    explain: "The user is authenticated, but the viewer role does not have permission to delete a project.",
    events: ["Authentication passes", "Rate limit passes", "Authorization checks role", "Request is blocked"]
  }
];
let idx = 0, answered = false;
function render(){
  const s=scenarios[idx]; answered=false;
  document.getElementById('round').textContent=`Scenario ${idx+1} of ${scenarios.length}`;
  document.getElementById('question').textContent=s.question;
  document.getElementById('snippet').textContent=s.snippet;
  const choices=document.getElementById('choices'); choices.innerHTML='';
  s.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);choices.appendChild(b);});
  document.getElementById('reveal').style.display='none';
  document.getElementById('feedback').style.display='none';
  document.getElementById('timeline').innerHTML='';
}
function choose(choice){
  if(answered) return; answered=true; const s=scenarios[idx];
  document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===s.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});
  const f=document.getElementById('feedback');f.innerHTML=`<strong>${choice===s.correct?'Prediction matched.':'Prediction missed.'}</strong>${s.explain}`;f.style.display='block';
  document.getElementById('reveal').style.display='inline-flex';
}
function reveal(){
  const t=document.getElementById('timeline'); t.innerHTML='';
  scenarios[idx].events.forEach((ev,i)=>{const row=document.createElement('div');row.className='event';row.innerHTML=`<span class="dot"></span><span>${i+1}. ${ev}</span>`;t.appendChild(row);setTimeout(()=>row.classList.add('visible'),i*250);});
}
function nextScenario(){idx=(idx+1)%scenarios.length;render();}
render();
</script>
</body>
</html>
