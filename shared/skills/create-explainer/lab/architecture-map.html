<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Architecture Map</title>
<style>
  :root {
    --bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;
    --text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;
    --accent:#58a6ff;--client:#3fb950;--server:#f0883e;--network:#a371f7;
    --font-mono:"SF Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}
  .container{max-width:1000px;margin:0 auto}
  h1{margin:0 0 8px;font-size:24px}
  p{color:var(--text-dim);margin:0 0 20px}

  .panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;margin:16px 0}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:12px 14px;text-align:left;border-bottom:2px solid var(--border);background:var(--bg-elev);font-weight:600;color:var(--text-bright);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
  td{padding:14px;border-bottom:1px solid var(--border);color:var(--text-dim);vertical-align:top}
  tr{cursor:pointer;transition:background .15s}
  tr:hover{background:rgba(255,255,255,0.03)}
  tr:hover td:first-child{color:var(--text-bright)}
  td:first-child{font-weight:500;color:var(--text-bright)}

  .detail{display:none;margin-top:16px;padding:20px;background:var(--bg);border:1px solid var(--border);border-radius:12px;animation:fadeIn .3s}
  .detail.show{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .detail-title{font-size:16px;font-weight:700;color:var(--text-bright);margin-bottom:10px}
  .detail-body{font-size:13px;color:var(--text-dim);line-height:1.7}
  .detail-body strong{color:var(--text-bright)}

  .tag-client{color:var(--client)}
  .tag-server{color:var(--server)}
  .tag-network{color:var(--network)}
</style>
</head>
<body>
<div class="container">
  <h1>&#128187; Architecture Map</h1>
  <p>Click any row to see which files own each business rule and how they connect.</p>

  <div class="panel">
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Business Rule</th>
            <th class="tag-client">Client</th>
            <th class="tag-server">Server</th>
            <th class="tag-network">Network</th>
          </tr>
        </thead>
        <tbody id="arch-table">
          <!-- ADAPT: Add rows for your concept's business rules -->
        </tbody>
      </table>
    </div>

    <div class="detail" id="detail-panel">
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   ADAPT THIS SECTION: Define your architecture rules.
   Each rule: { id, name, client, server, network, detail }
   detail: { title, body (HTML string) }
=============================================================== */
const archRules = [
  {
    id: "auth",
    name: "\uD83D\uDD12 Authenticate Request",
    client: "LoginForm.tsx",
    server: "auth.go:ValidateToken",
    network: "Authorization header",
    detail: {
      title: "Authentication Flow",
      body: "<strong>Client:</strong> LoginForm.tsx collects credentials and sends them via POST /login.<br><br><strong>Server:</strong> auth.go:ValidateToken checks the JWT signature, expiry, and issuer. On success, it sets a session cookie.<br><br><strong>Network:</strong> The Authorization: Bearer <token> header carries the JWT on every subsequent request."
    }
  },
  {
    id: "rate",
    name: "\u23F1 Rate Limit Check",
    client: "\u2014",
    server: "middleware.go:RateLimit",
    network: "\u2014",
    detail: {
      title: "Rate Limiting",
      body: "<strong>Server:</strong> middleware.go:RateLimit uses a token bucket per client IP. Requests beyond the limit receive 429 Too Many Requests.<br><br>The limit is configurable per endpoint. Burst capacity allows short spikes."
    }
  },
  {
    id: "validate",
    name: "\u2705 Validate Input",
    client: "FormValidation.ts",
    server: "validator.go:ValidateBody",
    network: "\u2014",
    detail: {
      title: "Input Validation",
      body: "<strong>Client:</strong> FormValidation.ts runs synchronous checks (required fields, regex patterns) for immediate feedback.<br><br><strong>Server:</strong> validator.go:ValidateBody re-validates everything. Client validation is for UX only; server validation is for security. Never trust the client."
    }
  },
  {
    id: "handler",
    name: "\u2699\uFE0F Run Business Handler",
    client: "\u2014",
    server: "handler.go:ProcessOrder",
    network: "\u2014",
    detail: {
      title: "Business Logic",
      body: "<strong>Server:</strong> handler.go:ProcessOrder is the core business function. It reads from the database, applies domain rules, and writes results.<br><br>It is wrapped by middleware for auth, rate limiting, and logging. The handler itself focuses purely on business logic."
    }
  },
  {
    id: "response",
    name: "\uD83D\uDCE4 Send Response",
    client: "ApiClient.ts:parseResponse",
    server: "handler.go:WriteJSON",
    network: "HTTP 200/201/4xx",
    detail: {
      title: "Response Flow",
      body: "<strong>Server:</strong> handler.go:WriteJSON serializes the response struct and sets the Content-Type: application/json header.<br><br><strong>Network:</strong> HTTP status codes communicate outcome: 200 (OK), 201 (Created), 400 (Bad Request), 401 (Unauthorized), etc.<br><br><strong>Client:</strong> ApiClient.ts:parseResponse checks the status code before parsing JSON. Errors are routed to the error handler."
    }
  },
  {
    id: "notify",
    name: "\uD83D\uDD14 Notify Others",
    client: "NotificationBell.tsx",
    server: "publisher.go:PublishEvent",
    network: "WebSocket / SSE",
    detail: {
      title: "Real-time Notifications",
      body: "<strong>Server:</strong> publisher.go:PublishEvent writes to a message bus (or broadcasts via WebSocket).<br><br><strong>Network:</strong> WebSocket for bidirectional, SSE for server-to-client only.<br><br><strong>Client:</strong> NotificationBell.tsx listens for events and updates the unread count badge."
    }
  }
];

function renderTable() {
  const tbody = document.getElementById("arch-table");
  tbody.innerHTML = "";
  archRules.forEach(rule => {
    const tr = document.createElement("tr");
    tr.onclick = () => showDetail(rule.id);
    tr.innerHTML =
      '<td>' + rule.name + '</td>' +
      '<td>' + rule.client + '</td>' +
      '<td>' + rule.server + '</td>' +
      '<td>' + rule.network + '</td>';
    tbody.appendChild(tr);
  });
}

function showDetail(id) {
  const rule = archRules.find(r => r.id === id);
  if (!rule) return;
  document.getElementById("detail-title").innerHTML = rule.detail.title;
  document.getElementById("detail-body").innerHTML = rule.detail.body;
  document.getElementById("detail-panel").classList.add("show");
  document.getElementById("detail-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

renderTable();
</script>
</body>
</html>
