<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Template: Node Graph Builder</title>
<style>
  /* ================================================================
     NODE GRAPH BUILDER — n8n-style directed graph constructor
     ================================================================
     ADAPT: Replace --bg, --accent, --client, etc. with your theme.
     ADAPT: Change graphRounds[] to match your concept's dependency graph.
     ADAPT: Change NODE_W and canvas size to fit your layout.
  ================================================================ */
  :root {
    --bg:#0d1117;--bg-elev:#161b22;--bg-card:#1c2128;--border:#30363d;
    --text:#c9d1d9;--text-dim:#8b949e;--text-bright:#e6edf3;
    --accent:#58a6ff;--client:#3fb950;--server:#f0883e;--network:#a371f7;
    --fx:#f778ba;--danger:#f85149;--warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.6}
  .container{max-width:1000px;margin:0 auto}
  h1{margin:0 0 8px;font-size:24px}
  p{color:var(--text-dim);margin:0 0 20px}

  /* Canvas */
  #canvas{position:relative;width:100%;height:520px;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;overflow:hidden;user-select:none}
  #grid{position:absolute;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:20px 20px;opacity:.4}
  #edges{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  #nodes{position:absolute;inset:0;z-index:2;pointer-events:none}

  /* Node */
  .node{position:absolute;width:180px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;cursor:grab;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:box-shadow .15s,transform .15s;z-index:3;pointer-events:auto;user-select:none;touch-action:none}
  .node:active{cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:scale(1.02)}
  .node.locked{opacity:.85;cursor:default}
  .node.locked:active{transform:none;cursor:default}
  .node-header{height:6px;border-radius:10px 10px 0 0;background:var(--accent)}
  .node-body{padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-bright);line-height:1.35;min-height:44px;display:flex;align-items:center}

  /* Port */
  .port{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid var(--text-dim);background:var(--bg);top:50%;transform:translateY(-50%);cursor:crosshair;z-index:4;transition:border-color .15s,box-shadow .15s}
  .port:hover{border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
  .port.connected{border-color:var(--client);background:var(--client);box-shadow:0 0 8px var(--client)}
  .port.input{left:-7px}
  .port.output{right:-7px}

  /* Edge */
  .edge{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--accent))}
  .edge.temp{stroke-dasharray:8 4}
  .edge.good{stroke:var(--client);filter:drop-shadow(0 0 6px var(--client))}
  .edge.bad{stroke:var(--danger);filter:drop-shadow(0 0 6px var(--danger))}

  /* Controls */
  .controls{display:flex;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-bright);font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .score{font-family:monospace;font-size:14px;color:var(--accent)}
  .feedback{display:none;margin-top:12px;padding:14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center}
</style>
</head>
<body>
<div class="container">
  <h1>&#129513; Node Graph Builder</h1>
  <p>Drag nodes to rearrange. Click an output port and drag to an input port to connect. Build the dependency graph.</p>

  <div class="controls">
    <span class="score">Round <span id="round">1</span> / <span id="totalRounds">3</span></span>
    <span class="score">Score: <span id="score">0</span> / <span id="total">4</span></span>
    <button class="btn primary" id="checkBtn" onclick="checkGraph()">Check Graph</button>
    <button class="btn" id="nextBtn" onclick="nextRound()" style="display:none">Next Round</button>
    <button class="btn" id="restartBtn" onclick="restartGame()" style="display:none">Play Again</button>
  </div>

  <div id="canvas">
    <div id="grid"></div>
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
/* ================================================================
   ADAPT THIS SECTION: Define your concept's dependency graphs.
   Each round is a small directed graph with nodes and expected edges.
   Nodes: {id, text, outs (output ports), ins (input ports)}
   Edges: {from, out (port index), to, in (port index)}
=============================================================== */
const NODE_W = 180;
const graphRounds = [
  {
    name: "Request Flow",
    nodes: [
      {id:"click",text:"User Click",outs:1,ins:0},
      {id:"validate",text:"Validate Input",outs:1,ins:1},
      {id:"send",text:"Send Request",outs:1,ins:1},
      {id:"process",text:"Process on Server",outs:2,ins:1},
      {id:"respond",text:"Send Response",outs:0,ins:1},
      {id:"notify",text:"Notify Others",outs:0,ins:1},
    ],
    edges: [
      {from:"click",out:0,to:"validate",in:0},
      {from:"validate",out:0,to:"send",in:0},
      {from:"send",out:0,to:"process",in:0},
      {from:"process",out:0,to:"respond",in:0},
      {from:"process",out:1,to:"notify",in:0},
    ]
  },
  {
    name: "Error Handling",
    nodes: [
      {id:"request",text:"Incoming Request",outs:1,ins:0},
      {id:"auth",text:"Check Auth",outs:2,ins:1},
      {id:"error401",text:"Return 401",outs:0,ins:1},
      {id:"validate2",text:"Validate Body",outs:2,ins:1},
      {id:"error400",text:"Return 400",outs:0,ins:1},
      {id:"handler",text:"Run Handler",outs:1,ins:1},
      {id:"success",text:"Return 200",outs:0,ins:1},
    ],
    edges: [
      {from:"request",out:0,to:"auth",in:0},
      {from:"auth",out:0,to:"error401",in:0},
      {from:"auth",out:1,to:"validate2",in:0},
      {from:"validate2",out:0,to:"error400",in:0},
      {from:"validate2",out:1,to:"handler",in:0},
      {from:"handler",out:0,to:"success",in:0},
    ]
  },
  {
    name: "Data Pipeline",
    nodes: [
      {id:"source",text:"Read Source",outs:1,ins:0},
      {id:"transform",text:"Transform",outs:1,ins:1},
      {id:"validate3",text:"Validate",outs:2,ins:1},
      {id:"sink",text:"Write Sink",outs:0,ins:1},
      {id:"dlq",text:"Dead Letter Queue",outs:0,ins:1},
    ],
    edges: [
      {from:"source",out:0,to:"transform",in:0},
      {from:"transform",out:0,to:"validate3",in:0},
      {from:"validate3",out:0,to:"dlq",in:0},
      {from:"validate3",out:1,to:"sink",in:0},
    ]
  }
];

/* ================================================================
   ENGINE — You shouldn't need to change anything below here
   unless you're adding features (e.g., snap-to-grid, zoom).
=============================================================== */
let gc = { round:0, nodes:[], edges:[], hints:[], checked:false, dragging:null, dragNode:null };

function init() {
  gc = { round:0, nodes:[], edges:[], hints:[], checked:false, dragging:null, dragNode:null };
  document.getElementById("totalRounds").textContent = graphRounds.length;
  buildNodes();
  renderNodes();
}

function nodeHeight(n) { return Math.max(52, 20 + Math.max(n.ins, n.outs, 1) * 22); }

function buildNodes() {
  const data = graphRounds[gc.round];
  const canvas = document.getElementById("canvas");
  const cw = canvas.clientWidth || 960;
  const ch = canvas.clientHeight || 520;
  const nodes = data.nodes.map((n, i) => ({...n, idx:i, x:0, y:0, h:nodeHeight(n)}));

  // Scatter into columns by topological depth
  const colX = [40, Math.round(cw/2 - NODE_W/2), cw - NODE_W - 40];
  const sources = nodes.filter(n => n.ins === 0);
  const sinks = nodes.filter(n => n.outs === 0);
  const middle = nodes.filter(n => n.ins > 0 && n.outs > 0);

  const place = (arr, col, offsetY = 0) => {
    arr.forEach((n, i) => {
      n.x = colX[col];
      n.y = offsetY + i * Math.min(110, Math.floor((ch - 40) / Math.max(arr.length, 1)));
      n.y = Math.min(n.y, ch - n.h - 20);
    });
  };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  place(shuffle([...sources]), 0, 30);
  place(shuffle([...middle]), 1, 30);
  place(shuffle([...sinks]), 2, 30);

  gc.nodes = nodes;
  gc.edges = [];
  gc.hints = [];
  gc.checked = false;
  updateUI();
}

function updateUI() {
  document.getElementById("round").textContent = gc.round + 1;
  document.getElementById("score").textContent = "0";
  document.getElementById("total").textContent = String(graphRounds[gc.round].edges.length);
  document.getElementById("checkBtn").style.display = "inline-flex";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "none";
  document.getElementById("feedback").style.display = "none";
}

function renderNodes() {
  const container = document.getElementById("nodes");
  const svg = document.getElementById("edges");
  container.innerHTML = "";
  svg.innerHTML = "";

  gc.nodes.forEach(node => {
    const el = document.createElement("div");
    el.className = "node" + (node.locked ? " locked" : "");
    el.id = node.id;
    el.style.left = node.x + "px";
    el.style.top = node.y + "px";
    el.style.width = NODE_W + "px";
    el.style.height = node.h + "px";

    const header = document.createElement("div");
    header.className = "node-header";
    el.appendChild(header);

    const body = document.createElement("div");
    body.className = "node-body";
    body.textContent = node.text;
    body.style.height = (node.h - 6) + "px";
    el.appendChild(body);

    for (let i = 0; i < node.ins; i++) {
      const p = document.createElement("div");
      p.className = "port input";
      p.style.top = portY(node.h, node.ins, i) + "px";
      p.dataset.nodeId = node.id;
      p.dataset.port = "input";
      p.dataset.idx = String(i);
      el.appendChild(p);
    }
    for (let i = 0; i < node.outs; i++) {
      const p = document.createElement("div");
      p.className = "port output";
      p.style.top = portY(node.h, node.outs, i) + "px";
      p.dataset.nodeId = node.id;
      p.dataset.port = "output";
      p.dataset.idx = String(i);
      el.appendChild(p);
    }

    el.addEventListener("mousedown", e => {
      if (e.target.classList.contains("port")) return;
      gc.dragNode = { nodeId: node.id, offsetX: e.clientX - node.x, offsetY: e.clientY - node.y };
      el.style.zIndex = 10;
    });

    container.appendChild(el);
  });

  if (!container.dataset.gListeners) {
    container.dataset.gListeners = "1";
    container.addEventListener("mousedown", e => {
      const port = e.target.closest(".port.output");
      if (!port) return;
      e.stopPropagation(); e.preventDefault();
      startEdge(port.dataset.nodeId, parseInt(port.dataset.idx));
    });
    container.addEventListener("mouseup", e => {
      if (!gc.dragging) return;
      const port = e.target.closest(".port.input");
      if (port) { e.stopPropagation(); e.preventDefault(); completeEdge(port.dataset.nodeId, parseInt(port.dataset.idx)); }
      else { cancelEdge(); }
    });
  }
  redrawEdges();
}

function portY(h, total, idx) {
  if (total <= 1) return h / 2;
  const margin = 18;
  const usable = h - margin * 2;
  return margin + (idx + 1) * (usable / (total + 1));
}

function getPortCenter(nodeId, portType, idx) {
  const nodeEl = document.getElementById(nodeId);
  if (!nodeEl) return null;
  const canvas = document.getElementById("canvas");
  const cRect = canvas.getBoundingClientRect();
  const nRect = nodeEl.getBoundingClientRect();
  const port = nodeEl.querySelector('.port.' + portType + '[data-idx="' + idx + '"]');
  if (port) {
    const pRect = port.getBoundingClientRect();
    return { x: pRect.left + pRect.width/2 - cRect.left, y: pRect.top + pRect.height/2 - cRect.top };
  }
  const node = gc.nodes.find(n => n.id === nodeId);
  const total = portType === "output" ? node.outs : node.ins;
  const y = nRect.top + portY(node.h, total, idx) - cRect.top;
  const x = portType === "output" ? nRect.right - cRect.left : nRect.left - cRect.left;
  return { x, y };
}

function startEdge(fromId, outIdx) {
  const start = getPortCenter(fromId, "output", outIdx);
  if (!start) return;
  const svg = document.getElementById("edges");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("class", "edge temp");
  svg.appendChild(path);
  gc.dragging = { fromId, outIdx, path };
}

function moveEdge(e) {
  if (!gc.dragging) return;
  const canvas = document.getElementById("canvas");
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const start = getPortCenter(gc.dragging.fromId, "output", gc.dragging.outIdx);
  if (!start) return;
  const c1x = start.x + 60, c1y = start.y;
  const c2x = mx - 60, c2y = my;
  gc.dragging.path.setAttribute("d", `M ${start.x} ${start.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${mx} ${my}`);
}

function endEdgeGlobal(e) {
  if (!gc.dragging) return;
  if (gc.dragging.path) gc.dragging.path.remove();
  const target = document.elementFromPoint(e.clientX, e.clientY);
  const port = target?.closest(".port.input");
  if (port) completeEdge(port.dataset.nodeId, parseInt(port.dataset.idx));
  else cancelEdge();
}

function completeEdge(toId, inIdx) {
  if (!gc.dragging) return;
  const fromId = gc.dragging.fromId;
  const outIdx = gc.dragging.outIdx;
  if (fromId === toId) { cancelEdge(); return; }
  const dup = gc.edges.find(ed => ed.from === fromId && ed.out === outIdx && ed.to === toId && ed.in === inIdx);
  if (dup) { cancelEdge(); return; }
  gc.edges.push({ from: fromId, out: outIdx, to: toId, in: inIdx, type: "pending" });
  cancelEdge();
  redrawEdges();
}

function cancelEdge() {
  if (gc.dragging && gc.dragging.path) gc.dragging.path.remove();
  gc.dragging = null;
}

function bezierMid(p0, p1, p2, p3) {
  return {
    x: 0.125*p0.x + 0.375*p1.x + 0.375*p2.x + 0.125*p3.x,
    y: 0.125*p0.y + 0.375*p1.y + 0.375*p2.y + 0.125*p3.y
  };
}

function drawEdge(edge) {
  const svg = document.getElementById("edges");
  const from = getPortCenter(edge.from, "output", edge.out);
  const to = getPortCenter(edge.to, "input", edge.in);
  if (!from || !to) return;
  const c1x = from.x + 60, c1y = from.y;
  const c2x = to.x - 60, c2y = to.y;
  const d = `M ${from.x} ${from.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${to.x} ${to.y}`;
  const mid = bezierMid(from, {x:c1x,y:c1y}, {x:c2x,y:c2y}, to);

  // Wide invisible hit path
  const hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
  hitPath.setAttribute("d", d);
  hitPath.setAttribute("stroke", "transparent");
  hitPath.setAttribute("stroke-width", "16");
  hitPath.setAttribute("fill", "none");
  hitPath.style.cursor = "pointer";
  hitPath.style.pointerEvents = "auto";
  hitPath.addEventListener("mousedown", () => removeEdge(edge));
  svg.appendChild(hitPath);

  // Visible path
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const cls = "edge " + (edge.type === "good" ? "good" : edge.type === "bad" ? "bad" : "temp");
  path.setAttribute("class", cls);
  path.setAttribute("d", d);
  path.style.pointerEvents = "none";
  svg.appendChild(path);

  // Delete handle at midpoint
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.style.cursor = "pointer";
  g.style.pointerEvents = "auto";
  g.addEventListener("mousedown", () => removeEdge(edge));
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", mid.x); circle.setAttribute("cy", mid.y); circle.setAttribute("r", "7");
  circle.setAttribute("fill", "var(--bg-card)"); circle.setAttribute("stroke", "var(--danger)"); circle.setAttribute("stroke-width", "2");
  const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line1.setAttribute("x1", mid.x-3); line1.setAttribute("y1", mid.y-3);
  line1.setAttribute("x2", mid.x+3); line1.setAttribute("y2", mid.y+3);
  line1.setAttribute("stroke", "var(--danger)"); line1.setAttribute("stroke-width", "2");
  const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line2.setAttribute("x1", mid.x+3); line2.setAttribute("y1", mid.y-3);
  line2.setAttribute("x2", mid.x-3); line2.setAttribute("y2", mid.y+3);
  line2.setAttribute("stroke", "var(--danger)"); line2.setAttribute("stroke-width", "2");
  g.appendChild(circle); g.appendChild(line1); g.appendChild(line2);
  svg.appendChild(g);
}

function removeEdge(target) {
  gc.edges = gc.edges.filter(e => !sameEdge(e, target));
  redrawEdges();
}

function redrawEdges() {
  const svg = document.getElementById("edges");
  svg.innerHTML = "";
  gc.edges.forEach(e => drawEdge(e));
  gc.hints.forEach(h => drawHint(h));
}

function drawHint(hint) {
  const svg = document.getElementById("edges");
  const from = getPortCenter(hint.from, "output", hint.out);
  const to = getPortCenter(hint.to, "input", hint.in);
  if (!from || !to) return;
  const c1x = from.x + 60, c1y = from.y;
  const c2x = to.x - 60, c2y = to.y;
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("class", "edge");
  path.setAttribute("style", "stroke:var(--text-dim);stroke-dasharray:4 4;stroke-width:2;opacity:.35;filter:none;");
  path.setAttribute("d", `M ${from.x} ${from.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${to.x} ${to.y}`);
  path.style.pointerEvents = "none";
  svg.appendChild(path);
}

function sameEdge(a, b) { return a.from === b.from && a.to === b.to; } // port-agnostic validation

function checkGraph() {
  gc.checked = true;
  const expected = graphRounds[gc.round].edges;
  const user = gc.edges;
  const correct = [], wrong = [], missing = [];

  user.forEach(ue => { if (expected.some(ee => sameEdge(ue, ee))) correct.push(ue); else wrong.push(ue); });
  expected.forEach(ee => { if (!user.some(ue => sameEdge(ue, ee))) missing.push(ee); });

  gc.edges = gc.edges.map(e => {
    if (correct.some(c => sameEdge(c, e))) return {...e, type: "good"};
    if (wrong.some(w => sameEdge(w, e))) return {...e, type: "bad"};
    return e;
  });
  gc.hints = missing;
  redrawEdges();

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  document.getElementById("score").textContent = String(correct.length);

  if (wrong.length === 0 && missing.length === 0) {
    fb.style.cssText = "display:block;padding:14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;color:var(--client);background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.3)";
    fb.innerHTML = "&#9989; Perfect! All " + expected.length + " connections correct.";
    document.getElementById("checkBtn").style.display = "none";
    if (gc.round + 1 < graphRounds.length) document.getElementById("nextBtn").style.display = "inline-flex";
    else document.getElementById("restartBtn").style.display = "inline-flex";
    gc.nodes.forEach(n => n.locked = true);
    renderNodes();
  } else {
    const parts = [];
    if (correct.length) parts.push(correct.length + " correct");
    if (wrong.length) parts.push(wrong.length + " wrong");
    if (missing.length) parts.push(missing.length + " missing");
    fb.style.cssText = "display:block;padding:14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;color:var(--warn);background:rgba(210,153,34,0.1);border:1px solid rgba(210,153,34,0.3)";
    fb.innerHTML = "&#9888; " + parts.join(" &mdash; ") + ". Red = wrong, dashed = missing.";
  }
}

function nextRound() {
  gc.round++;
  if (gc.round >= graphRounds.length) return;
  gc.edges = []; gc.hints = []; gc.checked = false;
  buildNodes(); renderNodes();
}

function restartGame() { init(); }

// Global mouse handlers
window.addEventListener("mousemove", e => {
  if (gc.dragNode) {
    const canvas = document.getElementById("canvas");
    const rect = canvas.getBoundingClientRect();
    const node = gc.nodes.find(n => n.id === gc.dragNode.nodeId);
    if (node) {
      let nx = e.clientX - gc.dragNode.offsetX;
      let ny = e.clientY - gc.dragNode.offsetY;
      nx = Math.max(0, Math.min(nx, rect.width - NODE_W));
      ny = Math.max(0, Math.min(ny, rect.height - node.h));
      node.x = nx; node.y = ny;
      const el = document.getElementById(node.id);
      if (el) { el.style.left = nx + "px"; el.style.top = ny + "px"; }
      redrawEdges();
    }
  }
  if (gc.dragging) moveEdge(e);
});

window.addEventListener("mouseup", e => {
  if (gc.dragNode) {
    const el = document.getElementById(gc.dragNode.nodeId);
    if (el) el.style.zIndex = "";
    gc.dragNode = null;
  }
  if (gc.dragging) endEdgeGlobal(e);
});

window.addEventListener("resize", () => {
  if (document.getElementById("canvas")) {
    const canvas = document.getElementById("canvas");
    const rect = canvas.getBoundingClientRect();
    gc.nodes.forEach(n => { n.x = Math.min(n.x, rect.width - NODE_W); n.y = Math.min(n.y, rect.height - n.h); });
    renderNodes();
  }
});

init();
</script>
</body>
</html>
