# Template copied to ~/.codex/config.toml by install.sh.
# Keep machine/project-specific keys local there (for example `personality` and `[projects.*]`).

[features]
multi_agent = true
apps = true
hooks = true

# Agent roles (invoked via @name).
# Each role points to a role-specific config file under ~/.codex/agents/.

[agents.test_quality_verifier]
description = "Audit tests for vague assertions, improve coverage, and report results."
config_file = "agents/test_quality_verifier.toml"

# Optional: mark specific repos as trusted (paths are machine-specific).
# [projects."/absolute/path/to/repo"]
# trust_level = "trusted"
